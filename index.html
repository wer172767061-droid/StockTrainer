<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d1117">
    <title>Stock Trainer - 美股模拟交易</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://beacon.cdn.qq.com/sdk/4.5.9/beacon_web.min.js"></script>
<script>
(function(){
  try{
    var beacon=new BeaconAction({
      appkey:'0WEB06U85YBSLJNL',
      versionCode:'1.0.0',
      channelID:'share',
      delay:1000,
      sessionDuration:30*60*1000,
      isOversea:false,
      needReportRqdEvent:false
    });
    beacon.onDirectUserAction('preview_page_view',{
      'url':location.href,
      'referrer':document.referrer,
      'title':document.title,
      'sandbox_id':'22245b0c1e8d4e7f925bb5485902ad71'
    });
  }catch(e){}
})();
</script></head>
<body>

<div id="app">

    <!-- ========== 顶部栏 ========== -->
    <header class="top-bar">
        <div class="logo">
            <span class="logo-icon">📈</span>
            <span class="logo-title">Stock Trainer</span>
        </div>
        <div class="account-scroll">
            <div class="acct-item">
                <span class="acct-label">总资产</span>
                <span class="acct-value" id="totalEquity">$100,000</span>
            </div>
            <div class="acct-item">
                <span class="acct-label">盈亏</span>
                <span class="acct-value" id="pnlValue">$0</span>
            </div>
            <div class="acct-item">
                <span class="acct-label">收益率</span>
                <span class="acct-value" id="returnRate">0.00%</span>
            </div>
            <div class="acct-item day-badge">
                <span class="acct-label">交易日</span>
                <span class="acct-value" id="dayCounter">1/150</span>
            </div>
            <div class="acct-item cum-badge" id="cumulativeStats">
                <span class="cum-item">第1局</span>
            </div>
        </div>
    </header>

    <!-- ========== 股票信息头 ========== -->
    <div class="stock-header">
        <div class="stock-id">
            <span class="stock-symbol" id="stockName">加载中...</span>
            <span class="stock-ticker" id="stockCode"></span>
            <span class="data-badge" id="dataSource"></span>
        </div>
        <div class="price-block">
            <span class="price-now" id="currentPrice">$0.00</span>
            <span class="price-chg" id="priceChange"></span>
        </div>
    </div>

    <!-- ========== 财报提醒 ========== -->
    <div class="earnings-banner" id="earningsBanner" style="display:none"></div>

    <!-- ========== K线图 ========== -->
    <div class="chart-wrapper">
        <div id="chartContainer" class="chart-container">
        </div>
        <div class="vol-legend" id="volLegend">
            <span class="vol-legend-item"><span class="vol-dot" style="background:#f97316"></span>VOL5 <span id="volMA5Val">—</span></span>
            <span class="vol-legend-item"><span class="vol-dot" style="background:#c084fc"></span>VOL20 <span id="volMA20Val">—</span></span>
            <span class="vol-legend-item"><span class="vol-dot" style="background:#34d399"></span>VOL50 <span id="volMA50Val">—</span></span>
        </div>
        <div class="price-tooltip" id="priceTooltip" style="display:none">
            <div class="pt-date" id="ptDate"></div>
            <div class="pt-row"><span class="pt-label">O</span><span class="pt-val" id="ptOpen"></span></div>
            <div class="pt-row"><span class="pt-label">H</span><span class="pt-val" id="ptHigh"></span></div>
            <div class="pt-row"><span class="pt-label">L</span><span class="pt-val" id="ptLow"></span></div>
            <div class="pt-row"><span class="pt-label">C</span><span class="pt-val" id="ptClose"></span></div>
            <div class="pt-row"><span class="pt-label">V</span><span class="pt-val" id="ptVolume"></span></div>
            <div class="pt-change" id="ptChange"></div>
        </div>
        <!-- 画图 SVG overlay -->
        <svg class="draw-overlay" id="drawOverlay"></svg>
        <!-- 画图提示 -->
        <div class="draw-indicator" id="drawIndicator" style="display:none"></div>
        <!-- 画图工具栏 -->
        <div class="draw-toolbar" id="drawToolbar" style="display:none">
            <button class="dt-btn active" data-tool="trendline" onclick="selectDrawTool('trendline')">趋势线</button>
            <button class="dt-btn" data-tool="straightline" onclick="selectDrawTool('straightline')">直线</button>
            <button class="dt-btn" data-tool="horizontalline" onclick="selectDrawTool('horizontalline')">水平线</button>
            <button class="dt-btn" data-tool="ray" onclick="selectDrawTool('ray')">射线</button>
            <button class="dt-btn dt-magnet" id="magnetToggle" onclick="toggleMagnet()">磁吸</button>
            <button class="dt-btn" data-tool="rectangle" onclick="selectDrawTool('rectangle')">矩形</button>
            <button class="dt-btn" data-tool="arrow" onclick="selectDrawTool('arrow')">箭头</button>
            <button class="dt-btn" data-tool="fibonacci" onclick="selectDrawTool('fibonacci')">黄金分割</button>
            <button class="dt-btn" data-tool="brush" onclick="selectDrawTool('brush')">画笔</button>
            <button class="dt-btn dt-action" onclick="undoDrawing()">撤销</button>
            <button class="dt-btn dt-action" onclick="clearDrawings()">清除</button>
            <button class="dt-btn dt-close-btn" onclick="toggleDrawMode()">&#10005;</button>
        </div>
        <!-- 画图开关 -->
        <button class="draw-toggle" id="drawToggle" onclick="toggleDrawMode()">&#9999;&#65039;</button>
        <!-- 左侧止损浮动面板 -->
        <div class="sl-floating-panel" id="slFloatingPanel" style="display:none">
            <div class="sl-panel-header" id="slPanelHeader">
                <span class="sl-panel-icon">🛡️</span>
                <span class="sl-panel-title">止损</span>
                <span class="sl-panel-drag-hint">⋮⋮</span>
            </div>
            <div class="sl-panel-body" id="slPanelBody"></div>
        </div>
        <!-- 止损线左侧标签 -->
        <div class="sl-line-label" id="slLineLabel" style="display:none"></div>
    </div>

    <!-- ========== 持仓状态栏 ========== -->
    <div class="position-bar" id="positionBar">
        <span class="no-position">暂无持仓</span>
    </div>

    <!-- ========== 交易面板 ========== -->
    <div class="trade-panel">
        <div class="qty-section">
            <div class="trade-estimate" id="tradeEstimate"></div>
        </div>
        <!-- 交易按钮（上方）-->
        <div class="trade-actions">
            <div class="trade-pair">
                <button class="btn-long" id="btnLong" onclick="doLong()">
                    <span class="btn-arrow">▲</span> 做多
                </button>
                <button class="btn-short" id="btnShort" onclick="doShort()">
                    <span class="btn-arrow">▼</span> 做空
                </button>
            </div>
            <button class="btn-close-pos" id="btnClose" onclick="doClosePosition()" disabled>
                平仓
            </button>
        </div>
        <!-- 下一天 / 跳过（下方）-->
        <div class="nav-actions">
            <button class="btn-next" id="btnNext" onclick="nextDay()">
                下一天 &rarr;
            </button>
            <button class="btn-skip" id="btnSkip" onclick="skipStock()">
                跳过 &raquo;
            </button>
        </div>
    </div>

    <!-- ========== 交易记录抽屉 ========== -->
    <div class="history-drawer" id="historyDrawer">
        <div class="history-drawer-header">
            <h3>交易记录</h3>
            <button class="history-close" onclick="toggleHistory()">✕</button>
        </div>
        <div class="history-drawer-body" id="tradeHistory">
            <p class="empty-history">暂无交易记录</p>
        </div>
    </div>
    <div class="history-overlay" id="historyOverlay" onclick="toggleHistory()"></div>

    <!-- ========== 游戏结束弹窗 ========== -->
    <div class="modal-overlay" id="gameOverModal">
        <div class="modal">
            <h2 class="modal-title" id="modalTitle">游戏结束</h2>
            <div class="modal-body">
                <div class="result-summary" id="resultSummary"></div>
                <div class="result-grid" id="resultDetails"></div>
                <div class="result-stock" id="resultStock"></div>
            </div>
            <div id="resultButtons"></div>
        </div>
    </div>

    <!-- ========== 跳过弹窗 ========== -->
    <div class="modal-overlay" id="skipModal">
        <div class="modal skip-modal">
            <button class="modal-close-btn" onclick="skipCancel()">✕</button>
            <h2 class="modal-title">⏭️ 已跳过当前股票</h2>
            <div class="modal-body">
                <div class="skip-summary" id="skipSummary"></div>
                <div class="skip-stock-info" id="skipStockInfo"></div>
            </div>
            <div id="skipButtons">
                <button class="btn-restart" onclick="skipContinue()">换一只继续</button>
            </div>
        </div>
    </div>

    <!-- ========== 止损设置弹窗 ========== -->
    <div class="modal-overlay" id="stopLossModal">
        <div class="modal stop-loss-modal">
            <button class="modal-close-btn" onclick="closeStopLossPanel()">✕</button>
            <h2 class="modal-title">设置止损单</h2>
            <div class="modal-body">
                <div class="sl-position-info" id="slPositionInfo"></div>
                <div class="sl-input-section">
                    <label class="sl-label">止损价格</label>
                    <div class="sl-input-row">
                        <span class="sl-currency">$</span>
                        <input type="number" id="stopLossInput" class="sl-input" step="0.01" placeholder="0.00" inputmode="decimal" oninput="updateSlPreview()">
                    </div>
                </div>
                <div class="sl-quick-section">
                    <div class="sl-quick-label">快捷设置</div>
                    <div class="sl-quick-btns" id="slQuickBtns"></div>
                </div>
                <div class="sl-preview" id="slPreview"></div>
            </div>
            <div class="sl-actions">
                <button class="btn-sl-cancel" id="btnSlCancel" onclick="cancelStopLoss()" style="display:none">取消止损</button>
                <button class="btn-sl-set" onclick="setStopLoss()">确认设置</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Loading -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <p>正在获取真实美股数据...</p>
    </div>

</div>
<script src="app.js"></script>
</body>
</html>
